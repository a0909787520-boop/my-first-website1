<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>城市散步</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>城市散步</h1>
      <nav>
        <a href="#event">活動資訊</a>
        <a href="#signup">立即報名</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">TAIPEI WALKING TOUR</p>
        <h2>大稻埕午後散步</h2>
        <p>
          穿過老街與河岸，在三小時內認識城市故事與生活風景，感受大稻埕的歷史與日常溫度。
        </p>
      </section>

      <section id="event" class="event-card with-badge">
        <span class="badge">限量 30 位</span>
        <h2>活動資訊</h2>
        <p>時間：每週六 15:00–18:00</p>
        <p>地點：大稻埕河岸步道</p>
        <p>內容：老街巡禮、在地美食介紹、城市故事分享</p>
      </section>

      <aside class="notice-card">
        <span class="notice-badge">提醒</span>
        <h2>集合提醒</h2>
        <p>請提前 10 分鐘抵達，並自備飲水與輕便鞋，享受舒適的城市漫遊時光。</p>
      </aside>

      <section id="signup" class="signup">
        <h2>立即報名</h2>
        <a class="button" href="mailto:hello@example.com">報名表單</a>
      </section>
    </main>
  </body>
</html>
